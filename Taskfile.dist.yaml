# Taskfile.dist.yaml
#
# Task is a task runner / build tool that aims to be simpler and easier to use than, for example, GNU Make.
# https://taskfile.dev/installation/
#
# To see all available tasks:
# $ task --list
#
version: '3'
vars:
  VER:
    sh: git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || git rev-parse --short HEAD
tasks:
  default:
    desc: 'Task runner for the helper package.'
    cmds:
      - task --list-all
    silent: true
  build:
    desc: 'Build the ansimate binary.'
    cmds:
      - go build -v -trimpath -ldflags="-s -w -X main.version={{.VER}}" -o ansimate ./cmd/ansimate
  build-wasm:
    desc: 'Build the ansimate WASM binaries.'
    cmds:
      - cmd: GOOS=wasip1 GOARCH=wasm go build -v -trimpath -ldflags="-s -w -X main.version={{.VER}}" -o ansimate.wasm ./cmd/ansimate
      - cmd: GOOS=js GOARCH=wasm go build -v -trimpath -ldflags="-s -w -X main.version={{.VER}}" -o ansimate-web.wasm ./cmd/ansimate-web
  doc:
    desc: 'Read the Go package documentation.'
    cmds:
      - cmd: pkgsite -http localhost:8090
    silent: true
  lint:
    silent: false
    desc: Runs the Go formatter and lints the source code.
    ignore_error: true
    cmds:
      - cmd: clear
        platforms: [linux, darwin, freebsd]
      - cmd: gci write .
        platforms: [linux]
      - cmd: go fix ./...
      - cmd: gofumpt -l -w .
      - cmd: golangci-lint run -c .golangci.yaml
  lint-js:
    silent: false
    desc: Lint the CSS and JS.
    ignore_error: true
    dir: web
    cmds:
      - cmd: clear
        platforms: [linux, darwin, freebsd]
      - cmd: pnpm exec eslint .
      - cmd: pnpm exec stylelint --fix *.css
      - cmd: pnpm exec htmlhint *.html
  pkg-patch:
    silent: false
    desc: Update and apply patch the Go dependencies.
    cmds:
      - cmd: go get -u=patch -x
      - cmd: go mod verify
      - cmd: go mod tidy
  pkg-update:
    silent: false
    desc: Update the Go dependencies.
    cmds:
      - cmd: go get -u -x
      - cmd: go get go.uber.org/nilaway/cmd/nilaway@latest
      - cmd: go mod verify
      - cmd: go mod tidy
  pkg-js:
    desc: Update to the latest JS dependencies.
    dir: web
    cmds:
      - cmd: pnpm up --interactive --latest
  serve:
    desc: 'Run a local HTTP server for web/.'
    cmds:
      - cmd: GOOS=js GOARCH=wasm go build -v -trimpath -ldflags="-s -w -X main.version={{.VER}}" -o web/ansimate-web.wasm ./cmd/ansimate-web
      - cmd: cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/
      - cmd: go run web/serve.go
  test:
    desc: 'Run the test suite.'
    cmds:
      - go test -count 1 ./...
  testr:
    desc: 'Run the test suite with the slower race detection.'
    cmds:
      - go test -count 1 -race ./...
  testc:
    desc: 'Run the test suite with coverage output to the browser.'
    cmds:
      - go test -coverprofile=coverage.out ./... && go tool cover -html=coverage.out
